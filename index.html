<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholog — Sign In & Account Management</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom Modern Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Brand / Header -->
            <div class="card-header">
                <div class="brand-logo-wrapper">
                    <div class="brand-logo">S</div>
                </div>
                <h2>Welcome to Scholog</h2>
                <p>Sign in to manage your class attendance</p>
            </div>

            <!-- Tabs Switcher -->
            <div class="tabs">
                <button id="loginTab" class="tab active" onclick="switchTab('login')">Sign In</button>
                <button id="signupTab" class="tab" onclick="switchTab('signup')">Create Account</button>
            </div>

            <div id="alertBox" class="alert hidden"></div>

            <!-- Login Form -->
            <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="loginEmail">
                        <i data-lucide="mail"></i> Email Address
                    </label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="loginPassword">
                        <i data-lucide="lock"></i> Password
                    </label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="btn">
                    <span>Sign In</span>
                    <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="form" onsubmit="handleSignup(event)">
                <div class="input-group">
                    <label for="signupEmail">
                        <i data-lucide="mail"></i> Email Address
                    </label>
                    <input type="email" id="signupEmail" required placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="signupPassword">
                        <i data-lucide="lock"></i> Password
                    </label>
                    <input type="password" id="signupPassword" required placeholder="At least 6 characters" autocomplete="new-password">
                </div>
                <button type="submit" class="btn">
                    <span>Create Account</span>
                    <i data-lucide="user-plus" style="width: 16px; height: 16px;"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
