<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholog — Sign In</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom Modern Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Brand / Header -->
            <div class="card-header">
                <div class="brand-logo-wrapper">
                    <img src="SchologLogo.png" alt="Scholog Logo" class="brand-logo-img">
                </div>
                <h2>Welcome to Scholog</h2>
                <p>Sign in and manage your class </p>
            </div>

            <!-- Tabs Switcher -->
            <div class="tabs">
                <button id="loginTab" class="tab active" onclick="switchTab('login')">Sign In</button>
                <button id="signupTab" class="tab" onclick="switchTab('signup')">Create Account</button>
            </div>

            <div id="alertBox" class="alert hidden"></div>

            <!-- Login Form -->
            <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="btn">
                    <span>Sign In</span>
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="form" onsubmit="handleSignup(event)">
                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" required placeholder="user@example.com" autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required placeholder="At least 6 characters" autocomplete="new-password">
                </div>
                <button type="submit" class="btn">
                    <span>Create Account</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Custom logic script -->
    <script src="script.js"></script>
</body>
</html>
